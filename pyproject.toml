[project]
name = "assist-live"
version = "0.0.0"
description = "Experimental Home Assistant Assist integration"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.374",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "PyYAML==6.0.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/assist_live", "tools"]
explicit_package_bases = true

[tool.pyright]
venvPath = "."
venv = ".venv"
