[project]
name = "assist-live"
version = "0.0.0"
description = "Experimental Home Assistant Assist integration"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "assist-live-client==0.0.0",
    "gazetteer-matcher==1.1.0",
    "ha-ffmpeg==3.2.2",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    "mutagen==1.48.1",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "pytest-homeassistant-custom-component==0.13.374",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "PyYAML==6.0.3",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv.sources]
assist-live-client = { git = "https://github.com/legion-works/assist-live-server", rev = "961cacb31a013fceee612b245ea9c3cb5d745106", subdirectory = "client" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/assist_live", "tools"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["assist_live_client.*", "pymicro_vad", "micro_vad_cpp"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pymicro_vad"]
implicit_reexport = true

[tool.pyright]
venvPath = "."
venv = ".venv"
