rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no HA `actions`.
  appropriate-polling:
    status: done
    comment: >-
      No entity polls. The runtime reads server health at 30 s intervals,
      and at 5 s intervals after an unsatisfactory result. The 1 s tick
      examines only local turn deadlines.
  brands:
    status: exempt
    comment: >-
      The rule asks for images in the core_integrations folder of the brands
      repository, which does not accept custom integrations. HA 2026.3 and
      later versions read the icons from the `brand/` folder of this custom
      integration.
  common-modules:
    status: done
    comment: >-
      entity.py has the base entity. The integration has no coordinator,
      because the server pushes events and the turn ledger keeps the state.
  config-flow:
    status: done
    comment: Each field of each config and options step has a data_description.
  config-flow-test-coverage:
    status: done
    comment: >-
      The setup, reconfiguration, and options flow tests give 100 % branch
      coverage of config_flow.py (106 of 106 branches).
  dependency-transparency:
    status: done
    comment: >-
      assist-live-client has the Apache-2.0 license. A public workflow in
      assist-live-server builds and publishes the client to PyPI. The
      annotated tags client-v0.1.0a1 and client-v0.1.0a2 in assist-live-server
      mark the published commits.
  docs-actions:
    status: exempt
    comment: The integration has no HA `actions`.
  docs-conditions:
    status: exempt
    comment: The integration has no HA `conditions`.
  docs-high-level-description:
    status: done
    comment: README.md and docs/design.md give a description of the server and the HA parts.
  docs-installation-instructions:
    status: done
    comment: docs/setup.md gives the prerequisites and the installation steps.
  docs-removal-instructions:
    status: done
    comment: docs/setup.md gives the removal steps and the items that stay.
  docs-triggers:
    status: exempt
    comment: The integration has no HA `triggers`. It fires only HA events.
  entity-event-setup:
    status: done
    comment: >-
      The sensor adds its ledger listener in async_added_to_hass and removes
      it with async_on_remove. The STT and TTS entities have no subscriptions.
  entity-unique-id:
    status: done
    comment: Each entity has a unique ID from its satellite key.
  has-entity-name:
    status: done
    comment: The base entity sets has_entity_name. Names come from translation keys.
  runtime-data:
    status: done
    comment: The runtime is in ConfigEntry.runtime_data with a typed config entry.
  test-before-configure:
    status: done
    comment: The config flow reads the server bindings before it makes the entry.
  test-before-setup:
    status: todo
    comment: >-
      Setup continues when the server is unavailable, because the fallback
      engines must answer turns. The pinned client gives one refused error
      for each HTTP error status, so setup cannot find an incorrect token.
      The Silver reauthentication flow must have the same client change.
  unique-config-entry:
    status: done
    comment: >-
      The config flow aborts when an entry has the same server URL and token.
      It compares the bindings request that the client makes from each URL,
      at the first step and before it makes the entry. Different tokens on
      one server are different entries.

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration has no HA `actions`.
  config-entry-unloading:
    status: done
    comment: async_unload_entry releases the platforms and stops the runtime.
  docs-configuration-parameters:
    status: done
    comment: docs/configuration.md gives the purpose and default of each options field.
  docs-installation-parameters:
    status: done
    comment: docs/setup.md gives the purpose and default of each setup field.
  entity-unavailable:
    status: done
    comment: >-
      The latency sensor reports unavailable when the server health check
      is unsatisfactory. The STT and TTS entities can use their fallback
      engines during a server outage, so they do not use server health as
      their availability state. Each request checks its fallback and gives
      a turn error if neither route can answer.
  integration-owner:
    status: done
    comment: The manifest gives the integration owner.
  log-when-unavailable:
    status: done
    comment: Each entry logs one info message at the start and end of a server outage.
  parallel-updates:
    status: done
    comment: Each entity platform sets PARALLEL_UPDATES to 0.
  reauthentication-flow:
    status: todo
    comment: The integration has no reauthentication flow.
  test-coverage:
    status: done
    comment: >-
      Coverage of statements and branches is 97.08 % overall and above
      95 % in each module. See docs/verification.md.

  # Gold
  devices:
    status: done
    comment: >-
      The STT, TTS, and latency entities use the linked HA satellite device
      with its native identifiers and metadata. If that device is absent,
      DeviceInfo groups the entities by the configured satellite key.
  diagnostics:
    status: done
    comment: diagnostics.py gives redacted config entry diagnostics.
  discovery:
    status: exempt
    comment: The server does not announce a service that HA can discover.
  discovery-update-info:
    status: exempt
    comment: HA cannot discover the server at a new URL.
  docs-data-update:
    status: done
    comment: docs/usage.md#data-updates explains event updates, health intervals, and availability.
  docs-examples:
    status: done
    comment: docs/usage.md#examples gives YAML automations for latency and reply failure.
  docs-known-limitations:
    status: done
    comment: docs/usage.md#known-limits gives setup, voice, and playback limits.
  docs-supported-devices:
    status: done
    comment: docs/setup.md#devices gives tested hardware and device requirements.
  docs-supported-functions:
    status: done
    comment: docs/usage.md#entities-and-functions lists each entity and its function.
  docs-troubleshooting:
    status: done
    comment: docs/usage.md#problem-checks gives symptoms, causes, and repair steps.
  docs-use-cases:
    status: done
    comment: docs/usage.md#use-cases gives uses for voice forwarding, fallback, and latency.
  dynamic-devices:
    status: exempt
    comment: >-
      Each entry has a fixed set of explicit satellite links. New server keys
      do not identify an HA device and do not add a link on their own.
  entity-category:
    status: done
    comment: The latency sensor is diagnostic. STT and TTS are primary entities.
  entity-device-class:
    status: done
    comment: The latency sensor uses the `duration` device class.
  entity-disabled-by-default:
    status: done
    comment: >-
      The integration has no noisy entities. The diagnostic sensor stays on:
      device replay reads its turn state and it measures latency once per turn.
  entity-translations:
    status: done
    comment: The entity names come from strings.json.
  exception-translations:
    status: done
    comment: HomeAssistantError uses the domain and keys in the exception translations.
  icon-translations:
    status: exempt
    comment: The entities use the HA platform or device class icons.
  reconfiguration-flow:
    status: done
    comment: >-
      Reconfigure tests the new URL with the saved token and requires all
      configured satellite keys. It changes only the URL and reloads the entry.
  repair-issues:
    status: done
    comment: >-
      The issue translations give actions for server, pipeline, fallback engine,
      event stream, storage, voice selection, and destination problems.
  stale-devices:
    status: done
    comment: >-
      Setup removes devices and entities for old links that this entry owns.
      Users can also remove these devices from the device page. The integration
      keeps devices with active links, child devices, or other owners' entities.

  # Platinum
  async-dependency:
    status: done
    comment: assist-live-client uses asyncio and aiohttp.
  inject-websession:
    status: done
    comment: Setup and both config flow paths give the HA session to the client.
  strict-typing:
    status: todo
    comment: >-
      Strict mypy examines the integration. The pinned client lacks py.typed.
      Client 0.1.0a3 adds the marker.
