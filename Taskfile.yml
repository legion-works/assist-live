version: '3'

tasks:
  check:
    desc: Run local code and privacy checks with HA 2026.10.3
    cmds:
      - uv sync --locked
      - task: lint
      - task: typecheck
      - task: unit
      - uv run --locked python tools/check_bootstrap.py
      - uv run --locked python tools/check_ci.py
      - gitleaks dir . --redact --exit-code 1
      - gitleaks git . --redact --exit-code 1
      - |
        if [ -n "$PRIVATE_DENYLIST" ]; then
          uv run --locked python tools/check_public_tree.py --history --root . --private-denylist "$PRIVATE_DENYLIST"
        else
          uv run --locked python tools/check_public_tree.py --history --root .
        fi
  lint:
    cmds:
      - uv run --locked ruff format --check .
      - uv run --locked ruff check .
      - actionlint
  typecheck:
    cmds:
      - uv run --locked mypy
  unit:
    cmds:
      - uv run --locked pytest tests/ -q
  package-check:
    cmds:
      - uv run --locked python tools/check_packaging.py
  ha-minimum:
    cmds:
      - uv run --no-project --python 3.14.2 --with homeassistant==2026.10.1 --with pytest-homeassistant-custom-component==0.13.372 --with PyYAML==6.0.3 --with gazetteer-matcher==1.1.0 --with ha-ffmpeg==3.2.2 --with hassil==3.12.1 --with home-assistant-intents==2026.10.6 --with mutagen==1.48.1 --with pymicro-vad==1.0.1 --with pyspeex-noise==1.0.2 --with "assist-live-client @ git+https://github.com/legion-works/assist-live-server@b3b1e16e933fb5e7567c059f80e16faf68ef7d35#subdirectory=client" pytest tests/ -q
  hassfest:
    cmds:
      - docker run --rm -v "$PWD":/github/workspace ghcr.io/home-assistant/hassfest
  hacs:
    cmds:
      - docker run --rm -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e INPUT_CATEGORY=integration -e INPUT_IGNORE=brands -v "$PWD":/github/workspace ghcr.io/hacs/action:main
  secrets:
    cmds:
      - gitleaks git . --redact --exit-code 1
      - gitleaks dir . --redact --exit-code 1
