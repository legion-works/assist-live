name: Check release archive
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Require release authorization
        env:
          APPROVED: ${{ vars.ASSIST_LIVE_RELEASES_APPROVED }}
        run: test "$APPROVED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - run: uv run --locked python tools/check_packaging.py
      - name: Require the published client version
        env:
          CLIENT_VERSION: "0.0.0"
        run: uv run --locked python tools/check_release_pin.py --manifest custom_components/assist_live/manifest.json --pypi-version "$CLIENT_VERSION" --require-published
      - name: Build and check the archive without publication
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/assist-live.zip" HEAD custom_components/assist_live hacs.json LICENSE
          unzip -t "$RUNNER_TEMP/assist-live.zip"
          mkdir "$RUNNER_TEMP/package"
          unzip -q "$RUNNER_TEMP/assist-live.zip" -d "$RUNNER_TEMP/package"
          uv run --locked python -c 'import os; from pathlib import Path; from tools.check_packaging import check_packaging; failures = check_packaging(Path(os.environ["RUNNER_TEMP"]) / "package"); print(failures); raise SystemExit(bool(failures))'
