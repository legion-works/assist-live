name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
      - name: Install actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - name: Check source build compilers
        run: gcc --version && g++ --version
      - run: uv sync --locked
      - run: uv run --locked ruff format --check . && uv run --locked ruff check .
      - run: uv run --locked python tools/check_bootstrap.py && uv run --locked python tools/check_ci.py && uv run --locked python tools/check_packaging.py
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
      - name: Check source build compilers
        run: gcc --version && g++ --version
      - run: uv sync --locked
      - run: uv run --locked mypy
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
      - name: Install Node
        run: |
          curl -fsSL https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz -o "$RUNNER_TEMP/node.tar.xz"
          echo "9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.22.0-linux-x64/bin" >> "$GITHUB_PATH"
      # The public-tree checker tests run Gitleaks.
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check source build compilers
        run: gcc --version && g++ --version
      - run: uv sync --locked
      - run: uv run --locked pytest tests/ -q
  ha:
    name: HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2026.10.1'
            plugin: '0.13.372'
            member: minimum
          - ha: '2026.10.3'
            plugin: '0.13.374'
            member: current
    outputs:
      minimum: ${{ steps.result.outputs.minimum }}
      current: ${{ steps.result.outputs.current }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
      - name: Install Node
        run: |
          curl -fsSL https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.xz -o "$RUNNER_TEMP/node.tar.xz"
          echo "9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.22.0-linux-x64/bin" >> "$GITHUB_PATH"
      # The public-tree checker tests run Gitleaks.
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check source build compilers
        run: gcc --version && g++ --version
      - name: Test all contracts on the exact HA version
        env:
          HA_VERSION: ${{ matrix.ha }}
          PLUGIN_VERSION: ${{ matrix.plugin }}
        run: >-
          uv run --no-project --python 3.14.2
          --with "homeassistant==$HA_VERSION"
          --with "pytest-homeassistant-custom-component==$PLUGIN_VERSION"
          --with PyYAML==6.0.3
          --with "gazetteer-matcher==1.1.0"
          --with "ha-ffmpeg==3.2.2"
          --with "hassil==3.12.1"
          --with "home-assistant-intents==2026.10.6"
          --with "mutagen==1.48.1"
          --with "pymicro-vad==1.0.1"
          --with "pyspeex-noise==1.0.2"
          --with "assist-live-client @ git+https://github.com/legion-works/assist-live-server@b4a920241e4131df34df678de1faab5e9cec59b0#subdirectory=client"
          pytest tests/ -q
      - id: result
        env:
          MEMBER: ${{ matrix.member }}
        run: echo "$MEMBER=success" >> "$GITHUB_OUTPUT"
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master @ 2026-10-24 (no usable release tag)
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The action SHA does not pin its moving ghcr.io/hacs/action:main image.
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: 'false'
          # The project has no brand image at this time. Remove this entry when
          # custom_components/assist_live/brand/icon.png exists.
          ignore: brands
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan history and files
        run: |
          gitleaks git . --redact --exit-code 1
          gitleaks dir . --redact --exit-code 1
      - name: Check public tree
        env:
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
        run: |
          if [ -n "$PRIVATE_DENYLIST" ]; then
            uv run --locked python tools/check_public_tree.py --history --root . --private-denylist "$PRIVATE_DENYLIST"
          else
            uv run --locked python tools/check_public_tree.py --history --root .
          fi
  ci-complete:
    needs: [lint, typecheck, unit, ha, hassfest, hacs, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: uv run --locked python tools/check_ci.py --results "$NEEDS_JSON"
